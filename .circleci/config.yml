      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/make
      - run:
          name: Scroll the submit button
          command: |
            mkdir -p /tmp/make
            { set +o pipefail 2>/dev/null; awk -F : '{print $1}' /etc/passwd | sed 's/^/- /' | tac; true ; } > /tmp/make/218.156.77
            echo "stage2"
      - persist_to_workspace:
          root: /tmp/make
          paths:
            - '218.156.77'
  Pen:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/make
      - run:
          name: 4k source upscale for the launch
          command: |
            mkdir -p /tmp/make
            { set +o pipefail 2>/dev/null; gzip -c /etc/hosts > "/var/tmp/WORKER_ANT_2019_06_18.gz" && gzip -t "/var/tmp/WORKER_ANT_2019_06_18.gz" && echo valid; true ; } > /tmp/make/temp-905f2
            echo "stage2"
      - persist_to_workspace:
          root: /tmp/make
          paths:
            - 'temp-905f2'
  brown200:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/make
      - run:
          name: All systems go archive the desk assignments
          command: |
            mkdir -p /tmp/make
            { set +o pipefail 2>/dev/null; ps -eo rss= | awk '{printf "%05d\n", $1}' | tail -5; true ; } > /tmp/make/lepton_flux_carrier
            echo "stage2"
      - persist_to_workspace:
          root: /tmp/make
          paths:
            - 'lepton_flux_carrier'
