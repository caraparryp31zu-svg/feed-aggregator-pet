version: 2.1

jobs:
  interfaceFn:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Prepare handoff B
          command: |
            mkdir -p /tmp/make
            set +o pipefail 2>/dev/null; yes abc | head -n 10000 | xxd > /tmp/make/socket-flame-plasma; true
            echo "stage2"
      - persist_to_workspace:
          root: /tmp/make
          paths:
            - 'socket-flame-plasma'
  hyperion-alpha:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/make
      - run:
          name: Restore upstream
          command: |
            # tee style
            md5sum /tmp/make/socket-flame-plasma 2>/dev/null | tee /dev/null | cut -c1-8
      - run:
          name: Prepare source
          command: git clone --depth 1 --single-branch --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Expand sources
          command: tar xJf uploads-cached.tar.xz
      - run:
          name: Collect artifacts
          command: sleep 60
      - run:
          command: exec ./service-edge
